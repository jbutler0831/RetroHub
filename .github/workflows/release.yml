# Builds the Mac (native Swift, universal), Windows and Linux (desktop/ folder; x86_64, and
# arm64 for Raspberry Pi) versions of RetroHub and attaches them to the GitHub release that triggered the run.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    # Intel runner: the Apple silicon (macos-latest) pool often has no free machines. build.sh
    # still makes a universal app by compiling the arm64 and x86_64 slices separately.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: mac/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RetroHub-macOS
          path: mac/build/RetroHub.zip
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" mac/build/RetroHub.zip --clobber

  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm builds the arm64 AppImage for Raspberry Pi 4/5.
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: RetroHub-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.AppImage)
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
